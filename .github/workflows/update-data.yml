name: Actualizar datos del visor

"on":
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos
  workflow_dispatch: {}       # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar AEMET + GRAFCAN
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          GRAFCAN_API_KEY: ${{ secrets.GRAFCAN_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualizar datos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
